research_summary: >-
  We are an experimental research group studying quantum materials and devices,
  with interests spanning condensed matter physics and quantum information
  science. Our research explores how electronic interactions shape the properties
  of two-dimensional materials and how qubits interact with complex material
  systems. This involves designing and fabricating superconducting quantum
  circuits and two-dimensional van der Waals devices, and studying their
  properties and interactions using low-noise DC and RF measurements.
