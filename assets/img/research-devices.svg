<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" fill="none" shape-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="devices-title devices-desc">
  <title id="devices-title">Materials-Enabled Quantum Device</title>
  <desc id="devices-desc">Three connected loop devices and electronic dispersion curves appear on the left. On the right, an atomically layered material exchanges excitations with three quantum modes, labeled a dagger a, b dagger b, and c dagger c. This schematic retains the composition of the original research illustration.</desc>
  <style>
    :root { color-scheme:light dark; --ink:#231f20; --label:#231f20; --accent:#92278f; --blue:#1c75bc; --blue-light:#c4e4f4; --blue-mid:#5ba3d4; --layer-blue:#6b8298; --warm:#f5835f; --warm-light:#f9cab9; --green:#40bc7d; --green-light:#bde7cf; --gray:#a7a9ac; --bond:#909ba1; --plane:#dce5e9; --gold:#d6c332; }
    @media (prefers-color-scheme:dark) {
      :root { --ink:#e0dcdc; }
    }
    .wire { stroke:var(--ink); stroke-width:5.5; stroke-linecap:round; stroke-linejoin:round; }
    .band { stroke:var(--ink); stroke-width:5.5; stroke-linecap:round; stroke-linejoin:round; }
    .exchange { stroke:var(--accent); stroke-width:8; stroke-linecap:round; marker-end:url(#devices-accent-arrow); }
    .occupation { fill:var(--label); font:500 57px Arial,Helvetica,sans-serif; text-anchor:middle; }
  
    /* Scale-aware stroke floors: retain native weights when enlarged. */
    .wire > path, .wire > rect, .band > path { vector-effect:non-scaling-stroke; stroke-width:max(.9px, 0.366666667vw); }
    .band > path[stroke-width="6"] { vector-effect:non-scaling-stroke; stroke-width:max(.9px, 0.400000000vw); }
    #devices-atomic-plane g[stroke] > path, svg > g[stroke="var(--bond)"] > path { vector-effect:non-scaling-stroke; stroke-width:max(.75px, 0.146666667vw); }
    .exchange > path { vector-effect:non-scaling-stroke; stroke-width:max(.9px, 0.533333333vw); }
    svg > g[stroke="var(--ink)"] > circle { vector-effect:non-scaling-stroke; stroke-width:max(.9px, 0.333333333vw); }
  </style>
  <defs>
    <marker id="devices-loop-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M2 2 10 6 2 10" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="devices-accent-arrow" viewBox="0 0 12 12" refX="9.3" refY="6" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M1 1 11 6 1 11 3.5 6Z" fill="var(--accent)"/>
    </marker>
    <radialGradient id="devices-mode-a" cx=".36" cy=".24" r=".87">
      <stop stop-color="var(--blue-light)"/><stop offset="1" stop-color="var(--blue-mid)"/>
    </radialGradient>
    <radialGradient id="devices-mode-b" cx=".36" cy=".24" r=".87">
      <stop stop-color="var(--warm-light)"/><stop offset="1" stop-color="var(--warm)"/>
    </radialGradient>
    <radialGradient id="devices-mode-c" cx=".36" cy=".24" r=".87">
      <stop stop-color="var(--green-light)"/><stop offset="1" stop-color="var(--green)"/>
    </radialGradient>
    <g id="devices-atomic-plane">
      <path d="m1070 400 180 18-48 36-180-18Z" fill="var(--plane)" fill-opacity=".12"/>
      <g stroke="var(--bond)" stroke-width="2.2" opacity=".76">
        <path d="m1070 400 180 18m-192-9 180 18m-192-9 180 18m-192-9 180 18m-192-9 180 18"/>
        <path d="m1070 400-48 36m68-34-48 36m68-34-48 36m68-34-48 36m68-34-48 36m68-34-48 36m68-34-48 36m68-34-48 36m68-34-48 36m68-34-48 36"/>
      </g>
      <g fill="currentColor">
        <circle cx="1070" cy="400" r="3.8"/><circle cx="1090" cy="402" r="3.8"/><circle cx="1110" cy="404" r="3.8"/><circle cx="1130" cy="406" r="3.8"/><circle cx="1150" cy="408" r="3.8"/><circle cx="1170" cy="410" r="3.8"/><circle cx="1190" cy="412" r="3.8"/><circle cx="1210" cy="414" r="3.8"/><circle cx="1230" cy="416" r="3.8"/><circle cx="1250" cy="418" r="3.8"/>
        <circle cx="1058" cy="409" r="3.8"/><circle cx="1078" cy="411" r="3.8"/><circle cx="1098" cy="413" r="3.8"/><circle cx="1118" cy="415" r="3.8"/><circle cx="1138" cy="417" r="3.8"/><circle cx="1158" cy="419" r="3.8"/><circle cx="1178" cy="421" r="3.8"/><circle cx="1198" cy="423" r="3.8"/><circle cx="1218" cy="425" r="3.8"/><circle cx="1238" cy="427" r="3.8"/>
        <circle cx="1046" cy="418" r="3.8"/><circle cx="1066" cy="420" r="3.8"/><circle cx="1086" cy="422" r="3.8"/><circle cx="1106" cy="424" r="3.8"/><circle cx="1126" cy="426" r="3.8"/><circle cx="1146" cy="428" r="3.8"/><circle cx="1166" cy="430" r="3.8"/><circle cx="1186" cy="432" r="3.8"/><circle cx="1206" cy="434" r="3.8"/><circle cx="1226" cy="436" r="3.8"/>
        <circle cx="1034" cy="427" r="3.8"/><circle cx="1054" cy="429" r="3.8"/><circle cx="1074" cy="431" r="3.8"/><circle cx="1094" cy="433" r="3.8"/><circle cx="1114" cy="435" r="3.8"/><circle cx="1134" cy="437" r="3.8"/><circle cx="1154" cy="439" r="3.8"/><circle cx="1174" cy="441" r="3.8"/><circle cx="1194" cy="443" r="3.8"/><circle cx="1214" cy="445" r="3.8"/>
        <circle cx="1022" cy="436" r="3.8"/><circle cx="1042" cy="438" r="3.8"/><circle cx="1062" cy="440" r="3.8"/><circle cx="1082" cy="442" r="3.8"/><circle cx="1102" cy="444" r="3.8"/><circle cx="1122" cy="446" r="3.8"/><circle cx="1142" cy="448" r="3.8"/><circle cx="1162" cy="450" r="3.8"/><circle cx="1182" cy="452" r="3.8"/><circle cx="1202" cy="454" r="3.8"/>
      </g>
    </g>
  </defs>

  <!-- The original three connected loop devices. -->
  <g class="wire">
    <path d="M126 226h54m112 0h40m112 0h48m112 0h62"/>
    <rect x="180" y="170" width="112" height="112" rx="32"/>
    <rect x="332" y="170" width="112" height="112" rx="32"/>
    <rect x="492" y="170" width="112" height="112" rx="32"/>
    <path d="M237 258a32 32 0 1 1 30-21" marker-end="url(#devices-loop-arrow)"/>
    <path d="M389 258a32 32 0 1 1 30-21" marker-end="url(#devices-loop-arrow)"/>
    <path d="M549 258a32 32 0 1 1 30-21" marker-end="url(#devices-loop-arrow)"/>
  </g>

  <!-- Dispersion curves retain the crossing branches and highlighted band. -->
  <g class="band">
    <path d="M123 575h548"/>
    <path d="M160 435c45 0 72 28 118 28s72-28 117-28 72 28 117 28 68-28 113-28"/>
    <path d="M160 435c45 0 72 54 118 54s72-54 117-54 72 54 117 54 68-54 113-54"/>
    <path d="M160 435c45 0 72 80 118 80s72-80 117-80 72 80 117 80 68-80 113-80"/>
    <path d="M160 710c45 0 72-28 118-28s72 28 117 28 72-28 117-28 68 28 113 28"/>
    <path d="M160 710c45 0 72-54 118-54s72 54 117 54 72-54 117-54 68 54 113 54"/>
    <path d="M160 710c45 0 72-80 118-80s72 80 117 80 72-80 117-80 68 80 113 80"/>
    <path d="M160 710c78 0 156-275 235-275s152 275 230 275" stroke="var(--gray)" opacity=".72"/>
    <path d="M160 435c78 0 156 275 235 275s152-275 230-275" stroke="var(--blue)" stroke-width="6"/>
  </g>

  <!-- Layered atomic material in the original center-right position. -->
  <g stroke="var(--bond)" stroke-width="2.2" opacity=".6">
    <path d="M1034 427v125m40-121v125m40-121v125m40-121v125m40-121v125M1214 445v125M1238 427v125"/>
  </g>
  <use href="#devices-atomic-plane" transform="translate(0 125)" style="color:var(--gray)"/>
  <use href="#devices-atomic-plane" transform="translate(0 100)" style="color:var(--layer-blue)"/>
  <use href="#devices-atomic-plane" transform="translate(0 75)" style="color:var(--gold)"/>
  <use href="#devices-atomic-plane" transform="translate(0 50)" style="color:var(--gray)"/>
  <use href="#devices-atomic-plane" transform="translate(0 25)" style="color:var(--layer-blue)"/>
  <use href="#devices-atomic-plane" style="color:var(--accent)"/>

  <!-- Paired arrows preserve two-way exchange with each mode. -->
  <g class="exchange">
    <path d="M1115 379c-16-28-18-54-10-77"/>
    <path d="M1152 294c15 23 18 49 9 75"/>
    <path d="M942 608c13-20 29-33 50-39"/>
    <path d="M1021 603c-13 17-30 29-49 34"/>
    <path d="M1253 604c14 18 31 28 52 32"/>
    <path d="M1315 601c-14-19-30-30-51-35"/>
  </g>

  <g stroke="var(--ink)" stroke-width="5">
    <circle cx="1130" cy="225" r="65" fill="url(#devices-mode-a)"/>
    <circle cx="881" cy="647" r="65" fill="url(#devices-mode-b)"/>
    <circle cx="1370" cy="647" r="65" fill="url(#devices-mode-c)"/>
  </g>
  <g class="occupation">
    <text x="1130" y="245">a<tspan baseline-shift="super" font-size="35">†</tspan>a</text>
    <text x="881" y="667">b<tspan baseline-shift="super" font-size="35">†</tspan>b</text>
    <text x="1370" y="667">c<tspan baseline-shift="super" font-size="35">†</tspan>c</text>
  </g>
</svg>
